name: Build Mac release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v4.4.6
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v4.4.6' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
          done
          exit 1
      - run: python3 scripts/install-mac-electron.py "$BUILD_ARCH"
      - run: python3 scripts/macos-icons.py
      - run: npm run build
      - name: Test native Opus to AAC conversion
        if: matrix.arch == 'arm64'
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import os from 'node:os';
          import assert from 'node:assert/strict';
          import {convertOpusFile} from './app/convert-audio.mjs';
          const root=await fs.mkdtemp(path.join(os.tmpdir(),'pocket-native-aac-'));
          try {
            for (const name of ['tone-mono.opus','tone-stereo.opus','tone-vorbis.ogg']) {
              const result=await convertOpusFile(path.resolve('test/fixtures',name),path.join(root,name+'.m4a'));
              assert.ok(result.duration>2.2 && result.duration<2.6);
            }
            console.log('PASS: production streaming decoder and native macOS afconvert, mono/stereo AAC.');
          } finally {await fs.rm(root,{recursive:true,force:true});}
          JS
      - name: Test editor on macOS
        if: matrix.arch == 'arm64'
        run: node scripts/studio-desktop-check.mjs
      - name: Package application
        run: npm exec -- electron-builder --mac dir --"$BUILD_ARCH" --config.electronDist=node_modules/electron/dist --publish never
      - name: Apply ad-hoc integrity signatures
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          arch = os.environ['BUILD_ARCH']
          app = pathlib.Path('release/mac-arm64' if arch == 'arm64' else 'release/mac') / 'Pocket Drop.app'
          def sign(item, profile=None):
              args = ['codesign', '--force', '--sign', '-', '--timestamp=none']
              if profile:
                  args += ['--entitlements', str(pathlib.Path('assets/signing') / profile)]
              subprocess.run(args + [str(item)], check=True)
          for item in sorted(app.rglob('*'), key=lambda p: len(p.parts), reverse=True):
              if item.is_file() and not item.is_symlink():
                  with item.open('rb') as f:
                      magic = f.read(4)
                  if magic == b'\xcf\xfa\xed\xfe':
                      sign(item)
          for item in sorted(app.rglob('*.framework'), key=lambda p: len(p.parts), reverse=True):
              if not item.is_symlink():
                  sign(item)
          for item in sorted(app.rglob('*.app'), key=lambda p: len(p.parts), reverse=True):
              sign(item, 'plugin.plist' if '(Plugin)' in item.name else 'jit.plist')
          sign(app, 'jit.plist')
          subprocess.run(['codesign', '--verify', '--deep', '--strict', '--verbose=2', str(app)], check=True)
          PY
      - name: Verify ARM64 signatures
        if: matrix.arch == 'arm64'
        run: python3 scripts/check-arm64-bundle.py 'release/mac-arm64/Pocket Drop.app'
      - name: Create download
        run: |
          if test "$BUILD_ARCH" = arm64; then APP_DIR=release/mac-arm64; else APP_DIR=release/mac; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/Pocket Drop.app" "release/Pocket-Drop-${RELEASE_TAG#v}-mac-$BUILD_ARCH.zip"
          unzip -tq "release/Pocket-Drop-${RELEASE_TAG#v}-mac-$BUILD_ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: release/Pocket-Drop-*-mac-${{ matrix.arch }}.zip
          compression-level: 0
          retention-days: 14

  upload-draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          path: release
          merge-multiple: true
      - name: Include corresponding source and checksums
        run: |
          git archive --format=zip --prefix="Pocket-Drop-${RELEASE_TAG#v}/" --output="release/Pocket-Drop-${RELEASE_TAG#v}-source.zip" HEAD
          cd release
          sha256sum *.zip > "SHA256SUMS-${RELEASE_TAG#v}.txt"
      - name: Upload verified files to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Pocket Drop ${RELEASE_TAG#v}" --notes 'See CHANGELOG.md for changes and README.md for installation.'
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
