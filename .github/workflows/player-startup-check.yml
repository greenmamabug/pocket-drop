name: Check signed player updater startup
on:
  workflow_dispatch:
    inputs:
      release:
        description: Published release to diagnose without a device
        required: true
        default: v4.7.2
permissions:
  contents: read
jobs:
  signed-startup:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the exact published Intel app
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_TAG: ${{ inputs.release }}
        run: |
          [[ "$CHECK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir signed-release
          gh release download "$CHECK_TAG" --repo "$GITHUB_REPOSITORY" --pattern "Pocket-Drop-${CHECK_TAG#v}-mac-x64.zip" --pattern "SHA256SUMS-${CHECK_TAG#v}.txt" --dir signed-release
          cd signed-release
          shasum -a 256 -c "SHA256SUMS-${CHECK_TAG#v}.txt" --ignore-missing
          unzip -q "Pocket-Drop-${CHECK_TAG#v}-mac-x64.zip"
          codesign --verify --deep --strict 'Pocket Drop.app'
      - name: Run the actual signed executable and its packaged helper
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          'signed-release/Pocket Drop.app/Contents/MacOS/Pocket Drop' "$GITHUB_WORKSPACE/scripts/signed-player-check.mjs" "$GITHUB_WORKSPACE/signed-release/Pocket Drop.app/Contents/Resources/app.asar/app/main.mjs"
      - name: Repeat with a minimal Finder-like environment
        run: |
          env -i HOME="$HOME" TMPDIR="$RUNNER_TEMP/" PATH=/usr/bin:/bin:/usr/sbin:/sbin ELECTRON_RUN_AS_NODE=1 'signed-release/Pocket Drop.app/Contents/MacOS/Pocket Drop' "$GITHUB_WORKSPACE/scripts/signed-player-check.mjs" "$GITHUB_WORKSPACE/signed-release/Pocket Drop.app/Contents/Resources/app.asar/app/main.mjs"
